# /etc/nginx/sites-available/bhabaghure.conf  →  symlinked from sites-enabled/
#
# Bhabaghure Holidays: every host in this one file (docs/deployment.md §7). Installed as a copy, never a symlink into
# the repository, so a git pull cannot change the shared nginx; deploy.sh warns when this file and the installed copy
# differ, and a person installs the change (nginx -t, then reload).
#
#   bhabaghure.com.bd, customer.  Next.js on 127.0.0.1:3340 (bhabaghure-web.service)
#   www.                          301 to the apex
#   admin.                        static build, admin/dist
#   api.                          Laravel, api/public, through our own PHP-FPM (bhabaghure-php.service)
#   wallet.                       static build, wallet/dist, and /api/v1/wallet — personal wallets behind their own sign-in (no allow-list since 2026-10-09)
#
# The domain sits behind Cloudflare with SSL mode Full (strict): Cloudflare connects on 443 and checks this
# certificate. The wildcard certificate (apex + *.bhabaghure.com.bd) is issued by certbot with DNS-01.

# 1 when the connection itself came from Cloudflare (the address before real_ip replaced it), else 0. The API reads
# visitor location from Cloudflare's headers only when this says 1 (docs/visitor-analytics.md): a visitor can send
# CF-IPCountry themselves, but can't connect from Cloudflare's addresses. Same list as set_real_ip_from below.
geo $realip_remote_addr $bh_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ── Plain http: straight to https ──────────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bhabaghure.com.bd www.bhabaghure.com.bd admin.bhabaghure.com.bd customer.bhabaghure.com.bd
                wallet.bhabaghure.com.bd api.bhabaghure.com.bd;

    access_log off;
    return 301 https://$host$request_uri;
}

# ── www → apex ─────────────────────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bhabaghure.com.bd;

    ssl_certificate     /etc/letsencrypt/live/bhabaghure.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabaghure.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    return 301 https://bhabaghure.com.bd$request_uri;
}

# ── Website and customer portal (one Next.js app; it picks the section from the Host header) ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bhabaghure.com.bd customer.bhabaghure.com.bd;

    ssl_certificate     /etc/letsencrypt/live/bhabaghure.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabaghure.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Visitors arrive through Cloudflare: log the visitor, not the edge. https://www.cloudflare.com/ips (2026-09-14).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/bhabaghure-web.access.log;
    error_log  /var/log/nginx/bhabaghure-web.error.log warn;

    # The API calls this over loopback (WEB_REVALIDATE_URL); it is never reachable from outside.
    location = /api/revalidate {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ── Admin (static single-page app) ─────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.bhabaghure.com.bd;

    ssl_certificate     /etc/letsencrypt/live/bhabaghure.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabaghure.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/Bhabagure/admin/dist;
    index index.html;

    access_log /var/log/nginx/bhabaghure-admin.access.log;
    error_log  /var/log/nginx/bhabaghure-admin.error.log warn;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# ── API (Laravel) ──────────────────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bhabaghure.com.bd;

    ssl_certificate     /etc/letsencrypt/live/bhabaghure.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabaghure.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Laravel rate-limits sign-ins, forms and bookings per visitor IP; without this every visitor would share the
    # handful of Cloudflare edge addresses and lock each other out.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/Bhabagure/api/public;
    index index.php;
    charset utf-8;

    # Media uploads are capped at 5 MB by the application; leave room for the form fields.
    client_max_body_size 8m;

    access_log /var/log/nginx/bhabaghure-api.access.log;
    error_log  /var/log/nginx/bhabaghure-api.error.log warn;

    # The wallet API exists only behind the wallet host's front door (Laravel refuses it here too).
    location ^~ /api/v1/wallet/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public website images (storage:link). Files only; a missing one is a plain 404, never PHP.
    location /storage/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # The front controller is the only PHP that runs.
    location = /index.php {
        fastcgi_pass unix:/run/bhabaghure-php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        # Not an HTTP_ name, so no request header can set it (see the geo block at the top).
        fastcgi_param BH_FROM_CLOUDFLARE $bh_from_cloudflare;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── Personal wallets (docs/phase-7-hr-attendance-bonus-wallet.md §8, docs/personal-wallets.md) ───────────────────────
# Its own static app, wallet/dist, and its own API path on this host only. Each staff member the super admin gives a
# wallet to signs in with their staff password (no authenticator code since 2026-10-09), in a session of its own, from anywhere: the
# IP allow-list was taken out on 2026-10-09 (the owner's decision) so personal wallets work from home and on phones.
# Sign-in attempts are rate-limited by address and by email (App\Wallet\WalletServiceProvider).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.bhabaghure.com.bd;

    ssl_certificate     /etc/letsencrypt/live/bhabaghure.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabaghure.com.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limits and the wallet's audit log must see the visitor's address, not Cloudflare's edge.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/Bhabagure/wallet/dist;
    index index.html;
    charset utf-8;
    # Evidence uploads are capped at 5 MB by the application.
    client_max_body_size 8m;

    access_log /var/log/nginx/bhabaghure-wallet.access.log;
    error_log  /var/log/nginx/bhabaghure-wallet.error.log warn;

    # The wallet API: Laravel's front controller, which answers /api/v1/wallet only for this host.
    location ^~ /api/v1/wallet/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/Bhabagure/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/Bhabagure/api/public;
        fastcgi_pass unix:/run/bhabaghure-php/php-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── API over loopback, for the website's server-side content fetches (web API_INTERNAL_URL) ───────────────────────
# Bound to 127.0.0.1 only: content requests never leave the box, and nothing outside can reach this listener.
server {
    listen 127.0.0.1:3341;
    server_name api.bhabaghure.com.bd;

    root /var/www/Bhabagure/api/public;
    access_log off;
    error_log /var/log/nginx/bhabaghure-api.error.log warn;

    location ^~ /api/v1/wallet/ {
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/bhabaghure-php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ \.php$ {
        return 404;
    }
}
