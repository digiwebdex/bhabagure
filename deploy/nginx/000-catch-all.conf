# /etc/nginx/sites-available/000-catch-all.conf  →  symlinked from sites-enabled/
#
# Answers requests whose Host matches no site on this server. Without it nginx hands them to the first server block
# it loaded (admin.sanitileserp.com.conf), so any domain pointed at this IP before its own site exists shows another
# client's application. Added 2026-09-14 while deploying Bhabaghure (docs/deployment.md §7).
#
# :80   close the connection without a response (444).
# :443  refuse the TLS handshake, so no certificate of any other site is shown for an unknown name.
# Every named site keeps matching its own server_name exactly as before; this block only replaces the implicit default.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    access_log off;
    ssl_reject_handshake on;
}
