; PHP-FPM for the Bhabaghure API only, run by bhabaghure-php.service as its own master process.
;
; Why its own master: it began on a shared server, where another site served PHP from the distribution's pool and a
; reload of that master cut off its requests. On the project's own VPS (since 2026-11-06, docs/deployment.md §8) the
; distribution's php8.5-fpm is disabled and this master is the only one; it keeps deploy.sh's tested reload and the
; systemd caps on memory and CPU. It still reads the stock /etc/php/8.5/fpm/php.ini and conf.d; overrides are below.
;
; Read from the checked-out repository: a change reaches the running service only through deploy.sh, which runs
; `php-fpm8.5 --test` first and keeps the running workers if the new file is invalid.

[global]
pid = /run/bhabaghure-php/php-fpm.pid
; To the journal: journalctl -t bhabaghure-php (a /proc/self/fd/2 log can't be opened on systemd's journal socket).
error_log = syslog
syslog.ident = bhabaghure-php
syslog.facility = daemon
log_level = warning
daemonize = no
; On reload, workers get this long to finish the request they are serving before they are stopped.
process_control_timeout = 30s
emergency_restart_threshold = 5
emergency_restart_interval = 1m

[bhabaghure]
; The master runs as www-data (the unit's User=), so the workers do too.
listen = /run/bhabaghure-php/php-fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; A request that runs longer than this is killed, so one stuck request cannot hold a worker forever.
request_terminate_timeout = 75s
request_slowlog_timeout = 10s
slowlog = /var/www/Bhabagure/api/storage/logs/php-fpm-slow.log
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/Bhabagure/api/storage/logs/php-errors.log
; Temporary files and uploads in progress go to /tmp, which the unit makes private to this service (PrivateTmp).
; OPcache does not look for changed files: new code takes effect when deploy.sh reloads this service, after composer
; and migrations have finished, not file by file while git is still writing them. Its memory size is set on the
; command line in the unit, because it is fixed when the master starts.
php_admin_value[opcache.validate_timestamps] = 0
