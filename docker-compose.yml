# Local development only.
#
# Never run this on the shared VPS. Production uses the server's existing MySQL
# and Redis, with a dedicated `bhabaghure` database and user and a
# project-specific Redis index (see _design/DEPLOYMENT.md).
#
# Usage:  cp .env.example .env   # then set the two passwords
#         docker compose up -d

name: bhabaghure

services:
  mysql:
    # 8.4 LTS. Once the VPS version is known, pin the same major.minor here.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bhabaghure}
      MYSQL_USER: ${DB_USERNAME:-bhabaghure_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — copy .env.example first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env — copy .env.example first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 127.0.0.1 only. Host port 3307 because a native MySQL may already own 3306.
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping exits 0 whenever the server is up, even without credentials.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  redis-data:
